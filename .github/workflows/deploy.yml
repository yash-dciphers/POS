name: Build and Deploy (DCiphers PO System)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dciphers-po:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dciphers-po:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dciphers-po:latest

      - name: Recreate container via Docker Compose
        run: docker compose -f /opt/dciphers-po/docker-compose.yml up -d --remove-orphans

      - name: Clean up old images
        run: docker image prune -f
